<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTROLE.X</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111821;
      border-bottom: 1px solid #263241;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    header p {
      color: #8d99a8;
      margin-top: 6px;
    }

    .container {
      padding: 25px 18px;
      max-width: 600px;
      margin: auto;
    }

    .status {
      background: #121a23;
      border: 1px solid #263241;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .status-title {
      color: #8d99a8;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .online {
      color: #35e38a;
      font-size: 20px;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      gap: 14px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 13px;
      background: #182331;
      color: white;
      font-size: 17px;
      cursor: pointer;
      border: 1px solid #2a394b;
    }

    button:active {
      transform: scale(0.98);
    }

    .danger {
      background: #35191d;
      border-color: #6b292f;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      color: #8d99a8;
      min-height: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>CONTROLE.X</h1>
    <p>Centre de contrôle</p>
  </header>

  <main class="container">

    <div class="status">
      <div class="status-title">ÉTAT DU SYSTÈME</div>
      <div class="online">● EN LIGNE</div>
    </div>

    <div class="buttons">
      <button onclick="action('Tableau de bord ouvert')">
        📊 Tableau de bord
      </button>

      <button onclick="action('Appareils sélectionnés')">
        📱 Mes appareils
      </button>

      <button onclick="action('Paramètres ouverts')">
        ⚙️ Paramètres
      </button>

      <button class="danger" onclick="action('Fonction de sécurité activée')">
        🛡️ Sécurité
      </button>
    </div>

    <div id="message"></div>

  </main>

  <script>
    function action(message) {
      document.getElementById("message").textContent = message;
    }
  </script>

</body>
</html>
